name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project files
        run: |
          plutil -lint \
            FatCatBreak.xcodeproj/project.pbxproj \
            FatCatBreak/Info.plist \
            CatBreakMonitorExtension/Info.plist \
            CatShieldConfigurationExtension/Info.plist \
            FatCatBreak/FatCatBreak.entitlements \
            CatBreakMonitorExtension/CatBreakMonitorExtension.entitlements \
            CatShieldConfigurationExtension/CatShieldConfigurationExtension.entitlements

      - name: Build for simulator
        run: |
          xcodebuild \
            -project FatCatBreak.xcodeproj \
            -target FatCatBreak \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
